name: checks

# Every pull request: build, gates, browser QA, and a deploy PLAN showing which
# WordPress pages the merge would change. Nothing is written to the site.
#
# Every merge to main: the same checks, then the changed blocks are published
# to WordPress (Level 2). Deploy only runs if every check passed.
#
# Manual run (Actions > checks > Run workflow): plan or apply, for the changed
# blocks or for every block. Use "plan" + "all" first on a new setup.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "plan shows what would change; apply writes to WordPress"
        type: choice
        options: [plan, apply]
        default: plan
      scope:
        description: "changed = blocks changed in the last commit; all = every block"
        type: choice
        options: [all, changed]
        default: all

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Build (widgets, hub, schema, Yoast, link graph, gates, manifest)
        run: bash generators/build.sh
      - name: Generated files are committed
        # build.sh regenerates the sidebar widgets, the /writing hub, page
        # schema and Yoast headers. If it changed anything, the committed
        # blocks are stale: run build.sh locally and commit the result.
        run: |
          if ! git diff --exit-code; then
            echo "::error::build.sh changed committed files. Run it and commit the output."
            exit 1
          fi
      - name: Essay content gate
        run: |
          if ls generators/rewrite/[0-9][0-9]-*.py >/dev/null 2>&1; then
            python3 generators/rewrite/qa.py
          fi
      - name: Life System engine tests
        run: node system/test-engine.js

  browser:
    name: Browser QA (layout, contrast, accessibility)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Install Playwright and Chromium
        run: |
          cd qa
          npm init -y >/dev/null
          npm install playwright@1.48.2 >/dev/null
          npx playwright install --with-deps chromium
      - name: Layout and accessibility, every page, 10 widths, both themes
        run: |
          cd qa
          bash mkall.sh
          pages=$(ls [0-9][0-9]-*.html | sed 's/\.html$//')
          node suite.js part_all.json $pages
          python3 check.py
      - name: Widget runtime
        run: |
          cd qa
          python3 mkwtest.py
          node wt.js

  deploy:
    name: Deploy to WordPress
    runs-on: ubuntu-latest
    needs: [build, browser]
    # Pull requests only plan, so they use a separate "preview" environment.
    # Real deploys use "production": add required reviewers there if you want
    # to approve each deploy by hand before it runs.
    environment: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
    env:
      WP_URL: ${{ secrets.WP_URL }}
      WP_USER: ${{ secrets.WP_USER }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
      YOAST_REST: ${{ vars.YOAST_REST }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Work out which blocks changed
        id: what
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'production-blocks/*.html' | xargs -r -n1 basename | tr '\n' ' ')
            echo "mode=plan" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.scope }}" = "all" ]; then files="--all"; else
              files=$(git diff --name-only HEAD~1 HEAD -- 'production-blocks/*.html' | xargs -r -n1 basename | tr '\n' ' '); fi
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          else
            before="${{ github.event.before }}"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then before="HEAD~1"; fi
            files=$(git diff --name-only "$before" HEAD -- 'production-blocks/*.html' | xargs -r -n1 basename | tr '\n' ' ')
            echo "mode=apply" >> "$GITHUB_OUTPUT"
          fi
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "Mode: $(grep '^mode=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)"
          echo "Blocks: ${files:-none}"
      - name: Deploy
        if: steps.what.outputs.files != ''
        working-directory: generators
        run: python3 -u deploy.py --${{ steps.what.outputs.mode }} ${{ steps.what.outputs.files }}
