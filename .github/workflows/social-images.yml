name: social-images

# Renders each essay's 1200x630 share image (qa/social.js) and commits any
# that changed to social/ on the pull request's branch, so they can be
# reviewed before merging. The deploy uploads them to WordPress.
on:
  pull_request:
    paths:
      - "production-blocks/*-post-*.html"
      - "generators/covers.py"
      - "generators/social-data.py"
      - "qa/social.js"
      - ".github/workflows/social-images.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    name: Render share images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Install Playwright, Chromium and the site fonts
        run: |
          mkdir -p /tmp/r
          cd /tmp/r
          npm init -y >/dev/null
          npm install playwright@1.48.2 @fontsource/inter@5.1.0 @fontsource/jetbrains-mono@5.1.0 >/dev/null
          npx playwright install --with-deps chromium
      - name: Render
        run: |
          cd generators
          python3 social-data.py /tmp/r/essays.json
          cd ..
          cp qa/social.js /tmp/r/social.js
          node /tmp/r/social.js /tmp/r/essays.json "$PWD/social" /tmp/r/node_modules
      - name: Commit changed images
        run: |
          git config user.name "social-images"
          git config user.email "social-images@users.noreply.github.com"
          git add social
          if git diff --cached --quiet; then
            echo "no image changes"
          else
            git commit -q -m "Share images rendered by social-images"
            git push -q
          fi
